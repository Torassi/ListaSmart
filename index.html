<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lista Smart — listas de compras colaborativas com foco em economia e comparação de preços." />

    <!--
      SECURITY: Content-Security-Policy aplicada via meta como linha de base para o ambiente de
      desenvolvimento. Em produção, o ideal é enviar a CSP (e demais headers: HSTS, X-Content-Type-Options,
      Referrer-Policy, etc.) pelo servidor/CDN, que tem precedência sobre o meta. 'unsafe-inline' em style
      é necessário para o Tailwind/Vite em dev; restrinja no build de produção.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 ws://localhost:5173 ws://127.0.0.1:5173; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />

    <!-- Fonte base Manrope (display/UI) com fallback definido no Tailwind. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Lista Smart</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
