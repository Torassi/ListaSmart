name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint, typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # SECURITY: auditoria de dependências. `--audit-level=high` ignora avisos
      # low/moderate (hoje só dev-only de esbuild/vite); vulnerabilidades
      # high/critical FALHAM o build de propósito (sem `|| true`).
      - name: Audit (high+)
        run: npm audit --audit-level=high --omit=dev

  backend:
    name: Backend — pytest & migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # SECRET_KEY é obrigatória (a app falha ao iniciar sem ela). Valor forte
      # exclusivo do CI — não é um segredo de produção.
      SECRET_KEY: ci-secret-key-not-for-production-0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile (sanity)
        run: python -m compileall app tests

      - name: Tests (pytest)
        run: python -m pytest

      - name: Validate migrations (alembic upgrade head)
        # Banco SQLite temporário e descartável só para validar as migrações.
        env:
          DATABASE_URL: sqlite:///./ci_migrations_check.db
        run: |
          alembic upgrade head
          rm -f ci_migrations_check.db
