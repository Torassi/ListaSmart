# Configuração do Alembic para o Lista Smart.
# A URL do banco é injetada em tempo de execução por alembic/env.py a partir
# das settings (.env), então `sqlalchemy.url` aqui fica como fallback.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./listasmart.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
